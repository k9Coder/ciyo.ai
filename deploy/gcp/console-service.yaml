apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ciyo-console
  labels:
    app: ciyo
    component: console
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 200 # static nginx, cheap to serve many concurrent requests per instance
      timeoutSeconds: 10
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/ciyo/console:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          # VITE_CLERK_PUBLISHABLE_KEY / VITE_API_BASE are baked into the bundle at
          # build time (Dockerfile ARGs) — nothing runtime-configurable needed here.
  traffic:
    - percent: 100
      latestRevision: true
