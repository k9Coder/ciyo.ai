services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promptshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/promptshield
      PORT: '3000'
      # pretzel-desktop's OAuth handoff redirects the system browser here to
      # sign in — must point at the actually-running console, or it silently
      # defaults to production and desktop sign-in never completes locally.
      PRETZEL_CONSOLE_URL: http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pretzel-console:
    build:
      context: ./pretzel-console
      dockerfile: Dockerfile
      args:
        # Dev/staging Clerk instance publishable key (public by design, safe to
        # commit — see the NOTE in pretzel-console/Dockerfile). Matches the
        # CLERK_SECRET_KEY already in backend/.env, so sign-in actually works
        # against the local backend. Same key pretzel-console/.env.staging and
        # e2e/.env.e2e use. Override via VITE_CLERK_PUBLISHABLE_KEY if needed.
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_cGxlYXNlZC1jbGFtLTI1LmNsZXJrLmFjY291bnRzLmRldiQ}
        VITE_API_BASE: http://localhost:3000
    ports:
      - '5173:8080'
    environment:
      API_ORIGIN: http://localhost:3000
      # Must match the Clerk instance baked into VITE_CLERK_PUBLISHABLE_KEY above.
      CLERK_FRONTEND_API: pleased-clam-25.clerk.accounts.dev
    depends_on:
      backend:
        condition: service_healthy

  mykka-web:
    build:
      context: ./mykka-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:3000
        NEXT_PUBLIC_ENV: development
    ports:
      - '3001:3001'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
