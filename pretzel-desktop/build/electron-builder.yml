appId: ai.mykka.pretzel-desktop
productName: Pretzel Desktop
copyright: Copyright © 2026 mykka.ai

directories:
  output: release/${version}

files:
  - dist-electron/**/*
  - dist/**/*
  - node_modules/**/*
  - package.json
  - build/icon.*

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

linux:
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Full reset on uninstall — the CA cert file, watchdog/sentinel temp
  # scripts, and cached auth state all live under userData; without this
  # they'd survive an uninstall and a later reinstall would start from
  # half-cleaned state.
  deleteAppDataOnUninstall: true
  # Custom cleanup for what lives OUTSIDE userData: OS proxy setting,
  # scheduled watchdog task, trusted CA cert, QUIC-block firewall rule.
  # See build/installer.nsh.
  include: build/installer.nsh

publish:
  provider: github
  owner: yarin-mag
  repo: mykka.ai
