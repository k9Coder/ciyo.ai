name: E2E Tests

on:
  pull_request:
    branches: [master, staging]
  push:
    branches: [master, staging]

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: e2e
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Install pretzel-console dependencies
        run: pnpm install --frozen-lockfile
        working-directory: pretzel-console

      - name: Install e2e dependencies
        run: pnpm install --frozen-lockfile
        working-directory: e2e

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: pretzel

      - name: Build extension
        run: pnpm run build -- --mode development
        working-directory: pretzel

      - name: Build pretzel-console
        run: pnpm run build:staging
        working-directory: pretzel-console
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE: http://localhost:3000

      - name: Run DB migrations on test DB
        run: pnpm run db:migrate
        working-directory: backend
        env:
          DATABASE_URL: postgres://e2e:e2e@localhost:5432/e2e

      - name: Build backend
        run: pnpm run build
        working-directory: backend

      - name: Start backend (test DB)
        run: node dist/index.js > /tmp/backend.log 2>&1 &
        working-directory: backend
        env:
          DATABASE_URL: postgres://e2e:e2e@localhost:5432/e2e
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          PORT: 3000

      - name: Serve pretzel-console
        run: pnpm exec vite preview --port 5173 > /tmp/console.log 2>&1 &
        working-directory: pretzel-console

      - name: Wait for services to be ready
        run: |
          npx wait-on http://localhost:3000/health http://localhost:5173 --timeout 30000 || {
            echo "=== backend log ===" && cat /tmp/backend.log
            echo "=== console log ===" && cat /tmp/console.log
            exit 1
          }

      - name: Run E2E suite
        run: pnpm test:e2e
        working-directory: e2e
        env:
          E2E_DATABASE_URL: postgres://e2e:e2e@localhost:5432/e2e
          E2E_ADMIN_URL: http://localhost:5173
          E2E_BACKEND_URL: http://localhost:3000
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          E2E_CLERK_ORG_ID: ${{ secrets.E2E_CLERK_ORG_ID }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
