name: E2E Tests

on:
  pull_request:
    branches: [master, staging]
  push:
    branches: [master, staging]

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: e2e
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Install pretzel-console dependencies
        run: pnpm install --frozen-lockfile
        working-directory: pretzel-console

      - name: Install e2e dependencies
        run: pnpm install --frozen-lockfile
        working-directory: e2e

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: pretzel

      - name: Build extension
        run: pnpm run build:e2e
        working-directory: pretzel
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.PRETZEL_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE: http://localhost:3000

      - name: Build pretzel-console
        run: pnpm run build:staging
        working-directory: pretzel-console
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.PRETZEL_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE: http://localhost:3000

      - name: Run DB migrations on test DB
        run: pnpm run db:migrate
        working-directory: backend
        env:
          DATABASE_URL: postgres://e2e:e2e@localhost:5432/e2e

      - name: Build backend
        run: pnpm run build
        working-directory: backend

      - name: Start backend (test DB)
        run: node dist/index.js > /tmp/backend.log 2>&1 &
        working-directory: backend
        env:
          DATABASE_URL: postgres://e2e:e2e@localhost:5432/e2e
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.E2E_CLERK_WEBHOOK_SECRET }}
          # The console is served at :5173; without this the backend falls back
          # to the prod allowlist (console.mykka.ai) and the browser blocks every
          # cross-origin API call after preflight, so all data-driven admin
          # tests time out. See backend/src/app.ts CORS origin resolution.
          CORS_ORIGIN: http://localhost:5173
          PORT: 3000
          # E2E hammers the API from the loopback runner; rate limiting would throttle
          # the suite itself. Limits are exercised by backend unit tests instead.
          RATE_LIMIT_DISABLED: true
          # The internal mesh (internal-client -> /internal/*) now requires a matching
          # secret; an empty value is rejected. Must equal the value in the E2E step so
          # the seed's compilePolicy internal call authenticates.
          INTERNAL_SECRET: test-secret-e2e-32chars-minimum-xxxx

      - name: Serve pretzel-console
        run: pnpm exec vite preview --port 5173 > /tmp/console.log 2>&1 &
        working-directory: pretzel-console

      - name: Wait for services to be ready
        run: |
          npx wait-on http://localhost:3000/health http://localhost:5173 --timeout 30000 || {
            echo "=== backend log ===" && cat /tmp/backend.log
            echo "=== console log ===" && cat /tmp/console.log
            exit 1
          }

      - name: Run E2E suite
        run: pnpm test:e2e
        working-directory: e2e
        env:
          E2E_DATABASE_URL: postgres://e2e:e2e@localhost:5432/e2e
          E2E_ADMIN_URL: http://localhost:5173
          E2E_BACKEND_URL: http://localhost:3000
          # global-setup runs seed:e2e, whose compilePolicy makes an internal-client call
          # to the backend on :3000 — must present the same secret the backend expects.
          INTERNAL_SECRET: test-secret-e2e-32chars-minimum-xxxx
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          # seed:e2e boots backend modules whose env validation requires this —
          # the webhook route itself is not exercised by the suite.
          CLERK_WEBHOOK_SECRET: ${{ secrets.E2E_CLERK_WEBHOOK_SECRET }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.PRETZEL_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          E2E_CLERK_ORG_ID: ${{ secrets.E2E_CLERK_ORG_ID }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.SHARED_DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "E2E Tests · ${{ github.ref_name }}"
          description: |
            Branch `${{ github.ref_name }}` · commit `${{ github.sha }}` · triggered by @${{ github.actor }}
            [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
