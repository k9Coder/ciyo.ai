name: Deploy pretzel-console

on:
  push:
    branches: [master, staging]
    paths:
      - 'pretzel-console/**'
      - '.github/workflows/pretzel-console-deploy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pretzel-console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: pretzel-console

      - name: Run tests
        run: pnpm test
        working-directory: pretzel-console

      - name: Typecheck
        run: pnpm typecheck
        working-directory: pretzel-console

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    permissions:
      contents: read
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.CONSOLE_RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::CONSOLE_RENDER_DEPLOY_HOOK is not set in the ${{ github.ref_name == 'master' && 'production' || 'staging' }} environment. Create the deploy hook in the Render dashboard and add it as an environment secret."
            exit 1
          fi
          curl --silent --output /dev/null --fail -X POST "$DEPLOY_HOOK"

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.SHARED_DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "pretzel-console → ${{ github.ref_name == 'master' && 'production' || 'staging' }}"
          description: "Branch `${{ github.ref_name }}` · commit `${{ github.sha }}`"
