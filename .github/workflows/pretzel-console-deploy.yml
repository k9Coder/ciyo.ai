name: Deploy pretzel-console

on:
  push:
    branches: [master, staging]
    paths:
      - 'pretzel-console/**'
      - '.github/workflows/pretzel-console-deploy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pretzel-console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: pretzel-console

      - name: Run tests
        run: pnpm test
        working-directory: pretzel-console

      - name: Typecheck
        run: pnpm typecheck
        working-directory: pretzel-console

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Wait for exact-SHA release checks
        run: node .github/scripts/wait-for-checks.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECKS: Backend API E2E,Extension E2E,Admin E2E,Cross-Service E2E

      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ github.ref_name == 'master' && secrets.RENDER_CONSOLE_PROD_DEPLOY_HOOK || secrets.RENDER_CONSOLE_STAGING_DEPLOY_HOOK }}
        run: curl --silent --output /dev/null --fail -X POST "$DEPLOY_HOOK"

      - name: Write deployment summary
        run: |
          {
            echo "### pretzel-console deployment"
            echo "- Tested SHA: \`${{ github.sha }}\`"
            echo "- Deployment trigger SHA: \`${{ github.sha }}\`"
            echo "- Environment: \`${{ github.ref_name == 'master' && 'production' || 'staging' }}\`"
            echo "- Provider: Render deploy hook"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "pretzel-console → ${{ github.ref_name == 'master' && 'production' || 'staging' }}"
          description: "Branch `${{ github.ref_name }}` · commit `${{ github.sha }}`"
