name: Deploy Backend

on:
  push:
    branches: [master, staging]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promptshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Guard against destructive migrations
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE"
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" -- 'backend/drizzle/*.sql' || true)
          if [ -z "$CHANGED" ]; then echo "No new migration files."; exit 0; fi
          echo "New migrations: $CHANGED"
          if echo "$CHANGED" | xargs grep -iE 'DROP[[:space:]]+(COLUMN|TABLE)|ALTER[[:space:]]+COLUMN.*[[:space:]]TYPE|RENAME[[:space:]]+(COLUMN|TO)'; then
            if [ "${{ vars.ALLOW_DESTRUCTIVE_MIGRATION }}" = "true" ]; then
              echo "Destructive migration explicitly allowed via ALLOW_DESTRUCTIVE_MIGRATION."
            else
              echo "::error::Destructive migration detected. Deploy runs migrations BEFORE the new image goes live, so non-additive changes break the running (old) code. Use expand/contract, or set repo variable ALLOW_DESTRUCTIVE_MIGRATION=true to override for this release."
              exit 1
            fi
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Run migrations
        run: pnpm exec tsx src/db/migrate.ts
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/promptshield_test

      # CI unit test run disabled — tests are now mandatory for the AI agent (Claude/Codex/etc.)
      # to run locally before and after every change. See AGENTS.md "Mandatory AI Test Policy".
      # - name: Run tests
      #   run: pnpm test
      #   working-directory: backend
      #   env:
      #     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/promptshield_test
      #     CLERK_SECRET_KEY: sk_test_dummy_for_tests
      #     CLERK_WEBHOOK_SECRET: whsec_test_dummy_for_tests
      #     INTERNAL_SECRET: test-secret

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Lowercase image name
        # ghcr.io requires an all-lowercase repository path; github.repository
        # preserves the owner's actual casing (e.g. k9Coder), which breaks the
        # docker build-push-action tag otherwise.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Migrate-first (expand/contract): run migrations BEFORE the new image goes
      # live, and fail the deploy if they error so a bad image never ships. This
      # is safe only for additive/backward-compatible migrations — the destructive
      # guard in the `test` job enforces that. Never DROP/rename a column in the
      # same release that stops using it.
      - name: Run DB migrations
        run: pnpm exec tsx src/db/migrate.ts
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}

      - name: Seed profession templates (idempotent)
        run: pnpm exec tsx src/db/seeds/run-profession-templates.ts
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}

      - name: Deploy to Render
        env:
          SERVICE_ID: ${{ secrets.BACKEND_RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.SHARED_RENDER_API_KEY }}
          IMAGE_URL: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          HTTP_STATUS=$(curl --silent --show-error --write-out '%{http_code}' \
            -X POST \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"${IMAGE_URL}\"}" \
            -o /tmp/render-response.json)
          cat /tmp/render-response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Render deploy failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.SHARED_DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Backend → ${{ github.ref_name == 'master' && 'production' || 'staging' }}"
          description: "Branch `${{ github.ref_name }}` · commit `${{ github.sha }}`"
