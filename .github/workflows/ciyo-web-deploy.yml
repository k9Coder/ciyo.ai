name: Deploy ciyo-web

on:
  push:
    branches: [master, staging]
    paths:
      - 'ciyo-web/**'
      - '.github/workflows/ciyo-web-deploy.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ciyo-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ciyo-web

      - name: Check marketing claims
        run: pnpm claims:check
        working-directory: ciyo-web

      - name: Lint
        run: pnpm lint
        working-directory: ciyo-web

      - name: Build (type-check)
        run: pnpm build
        working-directory: ciyo-web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:3000
          NEXT_PUBLIC_ENV: staging

      - name: Wait for exact-SHA release checks
        run: node .github/scripts/wait-for-checks.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECKS: Backend API E2E,Extension E2E,Admin E2E,Cross-Service E2E

      - name: Write deployment summary
        run: |
          {
            echo "### ciyo-web release gate"
            echo "- Tested SHA: \`${{ github.sha }}\`"
            echo "- Environment: \`${{ github.ref_name == 'master' && 'production' || 'staging' }}\`"
            echo "- Provider deployment: Vercel auto-deploy must remain disabled or protected outside this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "ciyo-web → ${{ github.ref_name == 'master' && 'production' || 'staging' }} (Vercel)"
          description: "Branch `${{ github.ref_name }}` · commit `${{ github.sha }}`"
