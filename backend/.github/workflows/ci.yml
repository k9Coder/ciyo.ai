name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ciyo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - name: Run migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/ciyo_test
      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/ciyo_test
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - run: pnpm build
